# SPDX-License-Identifier: GPL-3.0-or-later
name: Build, Test & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018 # Android NDK r27c (matches fdroid/com.rekorder.app.yml)
      BUILD_TOOLS_VERSION: 35.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK platform, build-tools & NDK r27c
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install \
            "platforms;android-35" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: Build reproducible unsigned APK & verify determinism
        env:
          ANDROID_BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          ./build.sh --unsigned
          HASH1="$(sha256sum build/rekorder-unsigned.apk | awk '{print $1}')"
          ./build.sh --unsigned
          HASH2="$(sha256sum build/rekorder-unsigned.apk | awk '{print $1}')"
          echo "Build 1 SHA-256: $HASH1"
          echo "Build 2 SHA-256: $HASH2"
          if [[ "$HASH1" != "$HASH2" ]]; then
            echo "ERROR: Reproducible build check failed!" >&2
            exit 1
          fi

      - name: Run native C & JVM unit tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          clang -O2 -Wall -Wextra -Inative tests/test_spsc_ring.c -lpthread -o /tmp/test_spsc_ring
          /tmp/test_spsc_ring
          clang -O2 -Wall -Wextra -Inative native/mp3_encoder.c tests/test_mp3_encoder.c -lm -o /tmp/test_mp3_encoder
          /tmp/test_mp3_encoder
          mkdir -p /tmp/rek_tests
          javac -cp "$ANDROID_HOME/platforms/android-35/android.jar:build/obj" -d /tmp/rek_tests tests/HostUnitTests.java
          java -cp "/tmp/rek_tests:build/obj:$ANDROID_HOME/platforms/android-35/android.jar" HostUnitTests

      - name: Sign release APK & publish GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASS: ${{ secrets.RELEASE_STORE_PASS }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          TAG="${GITHUB_REF_NAME}"
          RELEASE_APK="build/rekorder-${TAG}.apk"

          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_STORE_PASS" ]]; then
            echo "ERROR: Missing release signing secrets in GitHub Repository Settings -> Secrets -> Actions." >&2
            echo "Configure RELEASE_KEYSTORE_BASE64, RELEASE_KEY_ALIAS, RELEASE_STORE_PASS, and RELEASE_KEY_PASS." >&2
            exit 1
          fi

          KEYSTORE_FILE="$(mktemp /tmp/rekorder-release.XXXXXX.keystore)"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          chmod 600 "$KEYSTORE_FILE"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"

          RELEASE_KEYSTORE="$KEYSTORE_FILE" \
          OUT_APK="$RELEASE_APK" \
            ./build.sh

          (cd build && sha256sum "rekorder-${TAG}.apk" "rekorder-unsigned.apk" > SHA256SUMS.txt)
          cat build/SHA256SUMS.txt

          VERSION_CODE="$(sed -n 's/.*android:versionCode="\([0-9][0-9]*\)".*/\1/p' app/src/main/AndroidManifest.xml | head -n 1)"
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"

          NOTES_ARGS=(--generate-notes)
          if [[ -f "$CHANGELOG_FILE" ]]; then
            NOTES_ARGS=(--notes-file "$CHANGELOG_FILE")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" build/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$RELEASE_APK" build/SHA256SUMS.txt \
              --title "Rekorder ${TAG}" \
              "${NOTES_ARGS[@]}"
          fi
